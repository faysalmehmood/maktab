<title>Maktab Interface Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: a quiet review bench. Controls on top, one device frame in the middle holding a working mini-app, notes underneath. */
:root{--pg:#eaf0ee;--pg-fg:#14211f;--pg-muted:#566763;--pg-line:#cfd9d5;--pg-card:#ffffff;--pg-accent:#0f766e;--pg-accent-fg:#ffffff;--pg-bezel:#1b2624;
  --font:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--urdu:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0b1211;--pg-fg:#e6efed;--pg-muted:#93a5a1;--pg-line:#24322f;--pg-card:#141d1c;--pg-accent:#3fb8ab;--pg-accent-fg:#05201d;--pg-bezel:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0b1211;--pg-fg:#e6efed;--pg-muted:#93a5a1;--pg-line:#24322f;--pg-card:#141d1c;--pg-accent:#3fb8ab;--pg-accent-fg:#05201d;--pg-bezel:#000000;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--pg-fg);font:15px/1.5 var(--font)}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--pg-muted);max-width:62ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-weight:600;border:0;background:none;color:var(--pg-muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pg-accent);color:var(--pg-accent-fg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}
.stage{overflow-x:auto;padding-block:4px}
.frame{margin-inline:auto;height:780px;overflow:hidden;position:relative;border:1px solid var(--pg-line);border-radius:14px;background:#fff}
.frame.desktop{min-width:1040px}
.frame.phone{width:min(390px,100%);border:6px solid var(--pg-bezel);border-radius:30px}
.frame button{font:inherit;color:inherit;cursor:pointer}
.frame svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notes{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:14px;padding:16px 20px}
.notes h2{font-size:15px;margin:0 0 6px}
.notes ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;color:var(--pg-muted)}
.notes li{max-width:90ch}
.toast{position:absolute;inset-inline:0;bottom:76px;margin-inline:auto;width:max-content;max-width:86%;background:#14211f;color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.num{font-variant-numeric:tabular-nums}

/* ===== TODAY: the app as it is now ===== */
.t{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0a0a0a;background:#fff;display:flex;height:100%}
.t-side{width:240px;flex:none;border-right:1px solid #e5e5e5;overflow:auto}
.t-brand{padding:16px 20px;font-size:18px;font-weight:600}
.t-nav{display:flex;flex-direction:column;gap:4px;padding:8px}
.t-nav button{display:flex;gap:12px;align-items:center;min-height:44px;padding:0 12px;border:0;background:none;border-radius:6px;font-weight:500;text-align:start}
.t-nav button:hover,.t-nav .on{background:#f5f5f5}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column}
.t-top{height:56px;flex:none;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;padding:0 16px}
.t-top .sp{margin-inline-start:auto}
.t-body{flex:1;overflow:auto;padding:24px}
.t h1{font-size:20px;font-weight:600;margin:0}
.t h2{font-size:16px;font-weight:600;margin:0}
.t-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-col{display:flex;flex-direction:column;gap:16px}
.t-card{border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:16px;background:#fff}
.t-btn{height:44px;padding:0 14px;border:1px solid #e5e5e5;border-radius:8px;background:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);white-space:nowrap}
.t-btn.p{background:#0f766e;border-color:#0f766e;color:#fff}
.t-btn.g{border-color:transparent;box-shadow:none}
.t-in{height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:0 12px;font:inherit;background:#fff;min-width:0;color:#0a0a0a}
.t-mut{color:#737373}
.t-sm{font-size:12px}
.t-big{font-size:24px;font-weight:600}
.t-grid{display:grid;gap:12px}
.t-list{border:1px solid #e5e5e5;border-radius:10px}
.t-list>*{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid #e5e5e5;background:none;width:100%;text-align:start}
.t-list>*:last-child{border-bottom:0}
.t-ico{width:40px;height:40px;border-radius:50%;background:#f5f5f5;display:grid;place-items:center;flex:none;font-weight:500}
.t-badge{font-size:12px;padding:2px 8px;border-radius:6px;background:#f5f5f5;font-weight:500}
.t-chip{font-size:12px;padding:1px 6px;border-radius:4px;color:#fff;font-weight:500}
.t-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e5e5}
.t-line:last-child{border-bottom:0}
.t-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.t-cal div{aspect-ratio:1;border:1px solid #e5e5e5;border-radius:8px;display:grid;place-items:center;font-size:12px}
.t-ham{display:none}
.is-phone .t-side{display:none}
.is-phone .t-ham{display:inline-flex}
.is-phone .t-body{padding:16px}
.is-phone .t-top{padding:0 8px}
.t-drawer{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:5}
.t-drawer>div{width:288px;height:100%;background:#fff;overflow:auto}

/* ===== PROPOSED: calm ledger ===== */
.n{--bg:#f3f6f5;--sf:#ffffff;--ink:#14211f;--mut:#586966;--line:#dde5e2;--brand:#0f766e;--brand-fg:#ffffff;--soft:#e1f0ed;
  --side:#0d2b28;--side-fg:#c9dfda;--side-mut:#7fa39c;--side-on:#1a443f;
  --ok:#19704a;--ok-s:#e1f3e8;--bad:#b23a2e;--bad-s:#fbe8e5;--warn:#875800;--warn-s:#fbeed2;--info:#2a5d9c;--info-s:#e5eef9;--h:36px;
  font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);display:flex;height:100%}
.n.dark{--bg:#0c1413;--sf:#151f1e;--ink:#e6efed;--mut:#93a5a1;--line:#26342f;--brand:#3fb8ab;--brand-fg:#05201d;--soft:#15332f;
  --side:#081110;--side-fg:#b9cfca;--side-mut:#6f8d87;--side-on:#17302c;
  --ok:#5fcf97;--ok-s:#12301f;--bad:#f08a7e;--bad-s:#3a1a16;--warn:#e8b75a;--warn-s:#33270d;--info:#8db8ee;--info-s:#14263d}
.is-phone .n{--h:44px;flex-direction:column}
.n-side{width:232px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;overflow:auto}
.n-school{display:flex;gap:10px;align-items:center;padding:16px 16px 12px}
.n-school b{display:block;color:#fff;font-weight:600;line-height:1.2}
.n-school span{font-size:12px;color:var(--side-mut)}
.n-mark{width:34px;height:34px;flex:none}
.n-mark svg{width:100%;height:100%;stroke:none}
.n-grp{padding:6px 10px}
.n-grp h3{margin:8px 8px 4px;font-size:12px;font-weight:600;color:var(--side-mut)}
.n-grp button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;background:none;border-radius:8px;text-align:start;font-weight:500}
.n-grp button:hover{background:var(--side-on)}
.n-grp .on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.n.dark .n-grp .on{box-shadow:inset 3px 0 0 var(--brand)}
.n-cnt{margin-inline-start:auto;background:#f4c95d;color:#3a2a00;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.n-user{margin-top:auto;border-top:1px solid var(--side-on);padding:10px;position:relative}
.n-user>button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:start}
.n-user>button:hover{background:var(--side-on)}
.n-user small{display:block;color:var(--side-mut)}
.n-pop{position:absolute;bottom:62px;inset-inline:10px;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6}
.n-pop button{display:flex;gap:10px;align-items:center;width:100%;height:36px;border:0;background:none;border-radius:6px;padding:0 10px;text-align:start}
.n-pop button:hover{background:var(--soft)}
.n-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.n-top{flex:none;height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--sf);border-bottom:1px solid var(--line)}
.n-search{position:relative;flex:1;max-width:440px}
.n-search svg{position:absolute;top:50%;inset-inline-start:11px;transform:translateY(-50%);color:var(--mut)}
.n-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;padding-inline:36px 12px}
.n-res{position:absolute;top:42px;inset-inline:0;background:var(--sf);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:7;padding:4px}
.n-res button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:start}
.n-res button:hover{background:var(--soft)}
.n-sync{margin-inline-start:auto;display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;white-space:nowrap}
.n-sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.n-body{flex:1;min-height:0;overflow:auto;padding:24px}
.n-page{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.n-page.narrow{max-width:680px}
.n-ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.n h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.n h2{font-size:15px;font-weight:600;margin:0}
.n-sub{color:var(--mut);margin:2px 0 0}
.n-mut{color:var(--mut)}
.n-sm{font-size:12.5px}
.n-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.n-btn{height:var(--h);padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--sf);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.n-btn:hover{border-color:var(--mut)}
.n-btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.n-btn.q{border-color:transparent;background:none;color:var(--brand)}
.n-btn.big{height:48px;font-size:15px;width:100%}
.n-btn.sq{width:var(--h);padding:0}
.n-back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--mut);font-weight:600;padding:0;align-self:flex-start}
.n-panel{background:var(--sf);border:1px solid var(--line);border-radius:12px}
.n-panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.n-pad{padding:16px}
.n-in{height:var(--h);border:1px solid var(--line);border-radius:9px;background:var(--sf);color:var(--ink);font:inherit;padding:0 10px;min-width:0}
.n-av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.n-av.lg{width:64px;height:64px;font-size:22px;border-radius:16px}
.n-side .n-av{background:var(--side-on);color:#fff}
.n-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--mut)}
.n-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.n-badge.ok{background:var(--ok-s);color:var(--ok)}.n-badge.bad{background:var(--bad-s);color:var(--bad)}
.n-badge.warn{background:var(--warn-s);color:var(--warn)}.n-badge.info{background:var(--info-s);color:var(--info)}
.mny{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mny i{font-style:normal;font-weight:500;font-size:.78em;color:var(--mut);margin-inline-end:2px}
.n-tbl{width:100%;border-collapse:collapse}
.n-tbl th{font-size:12.5px;font-weight:600;color:var(--mut);text-align:start;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.n-tbl td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.n-tbl tr:last-child td{border-bottom:0}
.n-tbl .r{text-align:end}
.n-tbl tbody tr.go{cursor:pointer}
.n-tbl tbody tr.go:hover{background:var(--bg)}
.n-rows>*{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.n-rows>*:last-child{border-bottom:0}
.n-rows>button:hover{background:var(--bg)}
.n-grow{flex:1;min-width:0}
.n-end{margin-inline-start:auto}
.n-today{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.n-tc{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.n-tc .fig{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.n-tc .n-btn{margin-top:auto;align-self:flex-start}
.n-pips{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.n-pips button{height:22px;border-radius:5px;border:1.5px dashed var(--mut);background:none;padding:0}
.n-pips button.done{border:0;background:var(--brand)}
.n-split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.n-lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut)}
.n-lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}
.n-stats{display:grid;grid-template-columns:repeat(4,1fr)}
.n-stats>div{padding:14px 16px;border-inline-end:1px solid var(--line)}
.n-stats>div:last-child{border-inline-end:0}
.n-stats b{display:block;font-size:18px;font-weight:700}
.n-two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.n-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.n-tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.n-tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.n-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sf)}
.n-seg button{height:calc(var(--h) - 2px);min-width:var(--h);padding:0 10px;border:0;border-inline-end:1px solid var(--line);background:none;font-weight:600;color:var(--mut)}
.n-seg button:last-child{border-inline-end:0}
.n-seg .on{background:var(--soft);color:var(--brand)}
.n-seg .P.on{background:var(--ok-s);color:var(--ok)}.n-seg .A.on{background:var(--bad-s);color:var(--bad)}
.n-seg .L.on{background:var(--warn-s);color:var(--warn)}.n-seg .E.on{background:var(--info-s);color:var(--info)}
.n-save{position:sticky;bottom:-24px;margin:0 -24px -24px;padding:12px 24px;background:var(--sf);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.n-cal{display:grid;grid-template-columns:repeat(7,30px);gap:5px}
.n-cal span{height:30px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--mut)}
.n-cal .P{background:var(--ok-s);color:var(--ok)}.n-cal .A{background:var(--bad-s);color:var(--bad);font-weight:700}
.n-cal .L{background:var(--warn-s);color:var(--warn)}.n-cal .E{background:var(--info-s);color:var(--info)}
.n-urdu{font-family:var(--urdu);direction:rtl;text-align:right;line-height:2.1;white-space:pre-line}
.n-msg{background:var(--bg);border-radius:10px;padding:12px 16px}
.n-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.n-prog i{display:block;height:100%;background:var(--brand)}
.n-fld{display:flex;flex-direction:column;gap:6px}
.n-fld label{font-weight:600;font-size:13px}
.n-amt{height:52px;font-size:24px;font-weight:700;text-align:end}
.n-tabbar{flex:none;display:none;background:var(--sf);border-top:1px solid var(--line);padding-bottom:6px}
.n-tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:11px;font-weight:600;color:var(--mut);position:relative}
.n-tabbar .on{color:var(--brand)}
.n-tabbar .n-cnt{position:absolute;top:4px;inset-inline-start:calc(50% + 4px)}
.n-sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:6;display:flex;align-items:flex-end}
.n-sheet>div{background:var(--sf);color:var(--ink);width:100%;border-radius:18px 18px 0 0;padding:10px 10px 20px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.n-sheet button{display:flex;gap:10px;align-items:center;height:48px;border:0;background:none;border-radius:10px;padding:0 12px;font-weight:600;text-align:start}
.n-sheet h3{grid-column:1/-1;margin:6px 12px;font-size:13px;color:var(--mut)}
.is-phone .n-side{display:none}
.is-phone .n-tabbar{display:flex}
.is-phone .n-top{padding:0 12px;height:52px}
.is-phone .n-sync span{display:none}
.is-phone .n-body{padding:16px}
.is-phone .n-today,.is-phone .n-two{grid-template-columns:1fr}
.is-phone .n-stats{grid-template-columns:1fr 1fr}
.is-phone .n-stats>div:nth-child(2){border-inline-end:0}
.is-phone .n-stats>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.is-phone .n-save{bottom:-16px;margin:0 -16px -16px;padding:10px 16px}
.is-phone .n h1{font-size:20px}
.is-phone .hide-ph{display:none}
.n-foot{display:flex;align-items:center;gap:6px;padding:8px 8px 0;font-size:11.5px;color:var(--side-mut)}
.n-login{flex:1;display:grid;place-items:center;padding:24px;background:var(--bg)}
.n-login>div{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:min(380px,100%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.n-login small{display:flex;align-items:center;gap:6px;color:var(--mut);margin-top:18px}
.n-door{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.n-door .l{background:var(--side);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px;text-align:center;position:relative}
.n-door .r{background:var(--sf);display:flex;flex-direction:column;justify-content:center;padding:40px;overflow:auto}
.n-door .r>div{max-width:340px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.door-foot{position:absolute;bottom:14px}
.is-phone .n-door{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.is-phone .n-door .l{padding:26px 20px 18px}
.is-phone .n-door .r{padding:24px 20px;justify-content:flex-start}
.is-phone .door-foot{position:static;margin-top:6px}
.n-setup{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr}
.n-rail{background:var(--side);color:var(--side-fg);padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.n-rail div{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--side-mut);font-weight:500}
.n-rail div.on{background:var(--side-on);color:#fff}
.n-rail i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.n-setup main{overflow:auto;padding:28px;background:var(--bg)}
.n-setup .cols{display:grid;grid-template-columns:1fr 300px;gap:24px;max-width:860px;align-items:start}
.n-sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1.5px var(--line);padding:0}

.n-prev{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.n-prev .door{background:var(--side);color:#fff;border-radius:12px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.n-prev .strip{background:#fff;color:#14211f;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.25}
.n-prev .icon{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.is-phone .n-setup{grid-template-columns:1fr}
.is-phone .n-rail{display:none}
.is-phone .n-setup main{padding:16px}
.is-phone .n-setup .cols{grid-template-columns:1fr}
.brand h3{font-size:13px;margin:14px 0 8px;color:var(--pg-muted);font-weight:600}
.brand .tiles{display:flex;flex-wrap:wrap;gap:16px 28px}
.brand figure{margin:0;display:flex;flex-direction:column;gap:8px;max-width:230px}
.brand figcaption{color:var(--pg-muted);font-size:13px}
.brand figcaption b{color:var(--pg-fg);display:block}
.brand .art{height:88px;display:flex;align-items:center;gap:12px}
.brand .icon{width:68px;height:68px;border-radius:17px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;letter-spacing:.5px}
.brand .strip{background:#fff;color:#14211f;border:1px solid var(--pg-line);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.25}

n screen.","Navigation is grouped under five headings. The phone gets a bottom bar for the daily tasks.","Open the account menu at the bottom of the sidebar to try the dark theme. On the phone, use the moon button."]}};

/* ================= engine ================= */
const frame=document.getElementById("frame");let toastT;
function render(keep){const sc=frame.querySelector(".scroll"),y=keep&&sc?sc.scrollTop:0;
  frame.className="frame "+S.dev+(S.dev==="phone"?" is-phone":"");
  frame.innerHTML=S.v==="today"?(S.w==="login"?tLogin():S.w==="setup"?tSetup():renderToday()):(S.w==="login"?nLogin():S.w==="setup"?nSetup():renderNew());
  for(const k of["app","login","setup"])document.getElementById("w-"+k).setAttribute("aria-pressed",S.w===k);
  const ns=frame.querySelector(".scroll");if(ns)ns.scrollTop=y;
  for(const k of["today","new"])document.getElementById("v-"+k).setAttribute("aria-pressed",S.v===k);
  for(const k of["gsa","noor"])document.getElementById("s-"+k).setAttribute("aria-pressed",S.school===k);
  renderBrand();
  for(const k of["desktop","phone"])document.getElementById("d-"+k).setAttribute("aria-pressed",S.dev===k);
  const r=alias[S.route]&&S.v==="today"?S.route:S.route,nn=NOTES[S.v];
  document.getElementById("notes").innerHTML=`<h2>${S.v==="today"?"What you are looking at: the app today":"What changed on this screen"}</h2><ul>${(S.w==="app"?[...(nn[r]||[]),...nn._]:nn[S.w]).map(x=>`<li>${x}</li>`).join("")}</ul>`}
function renderBrand(){const c=SC(),T="#0f766e",U='font-family="Noto Nastaliq Urdu,serif"';
  document.getElementById("brand").innerHTML=`<h2>Branding idea: the school in front, Maktab behind</h2>
  <h3>What ${c.name} would get</h3><div class="tiles">
    <figure><div class="art">${crest(84)}</div><figcaption><b>School badge</b>Made automatically from the short name and colour until the school uploads its own logo.</figcaption></figure>
    <figure><div class="art"><div style="text-align:center"><div class="icon" style="background:${c.col}">${c.short}</div><div style="font-size:12px;margin-top:4px">${c.short}</div></div></div><figcaption><b>Phone home-screen icon</b>The installed app carries the school’s name and badge, not Maktab’s.</figcaption></figure>
    <figure><div class="art"><div class="strip">${crest(34)}<div><b>${c.name}</b><br>${c.city}</div></div></div><figcaption><b>Receipts, payslips, parent page</b>The same header on everything a parent or teacher sees.</figcaption></figure></div>
  <h3>Default Maktab mark: three rough sketches to choose a direction</h3><div class="tiles">
    <figure><div class="art"><svg viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="Sketch A"><rect width="72" height="72" rx="16" fill="${T}"/><path fill="#fff" d="M30 9h12a5 5 0 0 1 5 5v9h7a5 5 0 0 1 5 5v30a5 5 0 0 1-5 5H18a5 5 0 0 1-5-5V28a5 5 0 0 1 5-5h7v-9a5 5 0 0 1 5-5z"/><circle cx="36" cy="16" r="3" fill="${T}"/><text x="36" y="44" text-anchor="middle" ${U} font-size="24" fill="${T}">م</text><path d="M20 55h32" stroke="${T}" stroke-width="1.5" opacity=".45"/></svg></div><figcaption><b>A. Takhti, redrawn</b>Keeps today’s idea. Adds the handle hole and a real written meem so it stops reading as a clipboard.</figcaption></figure>
    <figure><div class="art"><svg viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="Sketch B"><circle cx="36" cy="36" r="36" fill="${T}"/><circle cx="36" cy="36" r="30" fill="none" stroke="#fff" stroke-width="1.5" opacity=".5"/><text x="36" y="38" text-anchor="middle" ${U} font-size="34" fill="#fff">م</text></svg></div><figcaption><b>B. Meem seal</b>A small round maker’s stamp. Quiet enough to sit under any school’s badge.</figcaption></figure>
    <figure><div class="art"><svg viewBox="0 0 150 88" width="150" height="88" role="img" aria-label="Sketch C"><text x="146" y="54" text-anchor="end" ${U} font-size="34" fill="var(--pg-accent)">مکتب</text><text x="4" y="84" font-family="Figtree,system-ui,sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="var(--pg-muted)">MAKTAB</text></svg></div><figcaption><b>C. Written wordmark</b>The Urdu word itself, in Nastaliq, is the logo. No symbol.</figcaption></figure></div>`}
function toast(t){clearTimeout(toastT);frame.querySelector(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;frame.appendChild(d);toastT=setTimeout(()=>d.remove(),2200)}
document.querySelector(".ctl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){S.v=b.dataset.v;S.drawer=S.menu=S.more=false;if(S.v==="today"&&["classes","payroll"].includes(S.route))S.route=alias[S.route]}
  if(b.dataset.sch)S.school=b.dataset.sch;
  if(b.dataset.w)S.w=b.dataset.w;
  if(b.dataset.d)S.dev=b.dataset.d;render()});
frame.addEventListener("click",e=>{const el=e.target.closest("[data-go],[data-act],[data-cycle],[data-set],[data-save],[data-tab],[data-mtab],[data-msg],[data-amt],[data-method],[data-ftabset],[data-toast],[data-pal]");
  if(!el){if(S.menu){S.menu=false;render(true)}return}
  const d=el.dataset;let keep=true,msg="";
  if(d.toast!==undefined){toast(d.toast);return}
  if(d.go){if(d.go==="student"){S.stu=+d.i;S.tab="overview"}if(d.go==="register")S.cls=+d.i;if(d.go==="fees")S.ftab=d.ftab||"counter";S.route=d.go;S.focus=false;S.drawer=S.menu=S.more=false;keep=false}
  else if(d.act==="drawer"){if(el.classList.contains("t-drawer")&&e.target!==el)return;S.drawer=!S.drawer}
  else if(d.act==="menu")S.menu=!S.menu;
  else if(d.act==="more"){if(el.classList.contains("n-sheet")&&e.target!==el)return;S.more=!S.more}
  else if(d.act==="dark"){S.dark=!S.dark;S.menu=false}
  else if(d.act==="signout"){S.w="login";S.menu=S.more=false}
  else if(d.act==="signin"){S.w="app";S.route="home";keep=false}
  else if(d.pal!==undefined){const x=PAL[+d.pal],c=SC();c.col=x.col;c.c=x.c;c.d=x.d}
  else if(d.act==="focus"){S.route="messages";S.focus=true;keep=false}
  else if(d.act==="unfocus")S.focus=false;
  else if(d.act==="pay"){const v=+(document.getElementById("n-amt").value.replace(/[^\d]/g,""))||0;if(!v){toast("Enter the amount received first");return}S.paid={amt:v,method:S.method};S.amount="";keep=false}
  else if(d.act==="newpay")S.paid=null;
  else if(d.cycle!==undefined){const a=attOf(S.cls),i=+d.cycle;a[i]="PALE"[("PALE".indexOf(a[i])+1)%4]}
  else if(d.set!==undefined)attOf(S.cls)[+d.set]=d.s;
  else if(d.save!==undefined){CLS[S.cls].cnt=cntOf(attOf(S.cls));S.route="attendance";keep=false;msg="Attendance saved for "+CLS[S.cls].prog+" "+CLS[S.cls].name}
  else if(d.tab)S.tab=d.tab;
  else if(d.mtab)S.mtab=d.mtab;
  else if(d.ftabset)S.ftab=d.ftabset;
  else if(d.amt){S.amount=(+d.amt).toLocaleString("en-US")}
  else if(d.method){const i=document.getElementById("n-amt");if(i)S.amount=i.value;S.method=d.method}
  else if(d.msg){const x=MSG[+d.i];if(d.msg==="open"){x.opened=true;msg="WhatsApp opens here in the real app"}else if(d.msg==="sent"){x.done="sent";S.sent++;msg="Marked sent"}else{x.done="skipped";S.skipped++;msg="Skipped"}}
  render(keep);if(msg)toast(msg)});
frame.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr.go"))e.target.click()});
frame.addEventListener("change",e=>{if(e.target.matches("[data-filter]")){S.fclass=e.target.value;render(true)}});
frame.addEventListener("input",e=>{if(e.target.id==="n-amt"){S.amount=e.target.value;return}
  if(["n-sn","n-sc","n-ss"].includes(e.target.id)){const c=SC(),v=e.target.value;
    if(e.target.id==="n-sn"){c.name=v;if(!S.st){c.short=v.split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).slice(0,4).join("")||"?";document.getElementById("n-ss").value=c.short}}
    else if(e.target.id==="n-sc")c.city=v;else{S.st=true;c.short=v.toUpperCase()||"?"}
    document.getElementById("n-prev").innerHTML=prevHTML();document.querySelector("#n-logo svg").outerHTML=crest(56);renderBrand();return}if(e.target.id!=="n-q")return;const q=e.target.value.trim().toLowerCase(),box=document.getElementById("n-res");
  if(!q){box.hidden=true;return}
  const hit=STU.map((s,i)=>[s,i]).filter(([s])=>(s.name+s.adm+s.phone+s.father).toLowerCase().includes(q)).slice(0,5);
  box.hidden=false;box.innerHTML=hit.map(([s,i])=>`<button data-go="student" data-i="${i}">${av(s.name)}<span><b style="font-weight:600">${s.name}</b><br><span class="n-mut n-sm">Class ${s.cls}, ${s.adm}</span></span></button>`).join("")||'<div class="n-mut" style="padding:8px">No student matches.</div>'});
render();
</script>
