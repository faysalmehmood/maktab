name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # better-sqlite3 ships prebuilt binaries and esbuild/workerd use optional platform packages,
      # so install scripts are unnecessary (and skipping them avoids a native rebuild).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Custom SQL migration is in sync with packages/db/sql
        run: npx tsx packages/db/scripts/sync-custom-sql.ts --check
