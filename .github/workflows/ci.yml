name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # better-sqlite3 ships prebuilt binaries and esbuild/workerd use optional platform packages,
      # so install scripts are unnecessary (and skipping them avoids a native rebuild).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Urdu dictionary complete (no missing / empty / untranslated keys, Latin digits)
        run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - name: First-load bundle budget (entry < 150 KB gzip, no zod / Urdu up front)
        run: npm run budget -w @maktab/web
      - name: Custom SQL migration is in sync with packages/db/sql
        run: npx tsx packages/db/scripts/sync-custom-sql.ts --check
