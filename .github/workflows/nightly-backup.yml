# Nightly encrypted backup of the D1 database (PLAN §9 layers 2 and 3). Runbook: docs/backup.md,
# restore: docs/restore.md, practice: .github/workflows/restore-drill.yml.
#
# Enable by setting the repository variable BACKUP_ENABLED=true (forks and clones stay quiet).
# Variables (optional): D1_DATABASE_NAME (default maktab), BACKUP_R2_BUCKET (default maktab-backups),
#   APP_URL (default https://maktab.conceptlix.com: where the run is reported),
#   BACKUP_ALLOW_SHRINK=true (accept one dump that is less than half the previous size; set it after
#   a deliberate big deletion, run, then remove it).
# Keep-alive: GitHub disables scheduled workflows after 60 days without repository activity, so on the
# 1st of each month (Karachi) the run commits docs/backup-status.md to main as github-actions[bot].
# Secrets:
#   CLOUDFLARE_API_TOKEN   Account > D1 > Edit; Account > Workers R2 Storage > Edit;
#                          Account > Workers Scripts > Read
#   CLOUDFLARE_ACCOUNT_ID
#   AGE_RECIPIENT          the PUBLIC age key "age1…"; the private key stays offline with two trustees
#   BACKUP_REPORT_TOKEN    same value as the Worker secret; POST /api/backup/runs
#   B2_KEY_ID, B2_APP_KEY, B2_BUCKET, B2_ENDPOINT   optional second provider (absent → run "partial")
#   GOOGLE_SA_JSON, SHEET_ID                        optional read-only Google Sheet copy
# Retention: R2 lifecycle rules (daily/ deleted after 95 days; monthly/ kept), set once in the
# Cloudflare dashboard (docs/backup.md). B2 is pruned here (90 daily, 24 monthly).
name: nightly-backup
on:
  schedule:
    - cron: "30 21 * * *" # 02:30 PKT: `d1 export --remote` blocks the DB while it runs.
  workflow_dispatch: {}
permissions:
  contents: write # the monthly docs/backup-status.md keep-alive commit
  issues: write
concurrency: { group: nightly-backup, cancel-in-progress: false }
env:
  R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET || 'maktab-backups' }}
  APP_URL: ${{ vars.APP_URL || 'https://maktab.conceptlix.com' }}
  WRANGLER_VERSION: 4.149.0
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  HAVE_B2: ${{ secrets.B2_KEY_ID != '' && secrets.B2_APP_KEY != '' && secrets.B2_BUCKET != '' && secrets.B2_ENDPOINT != '' }}
  HAVE_SHEET: ${{ secrets.GOOGLE_SA_JSON != '' && secrets.SHEET_ID != '' }}
jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # wrangler.toml (the production D1 binding), sql/ (names the dump must contain) and the Sheet
      # script. Nothing is built.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .nvmrc
            apps/api/wrangler.toml
            packages/db/sql
            packages/db/scripts/sheet-export.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Install wrangler, age, rclone
        run: |
          set -euo pipefail
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "KDAY=$(TZ=Asia/Karachi date +%d)" >> "$GITHUB_ENV"
          npm i --no-save --prefix "$RUNNER_TEMP/w" "wrangler@$WRANGLER_VERSION"
          echo "$RUNNER_TEMP/w/node_modules/.bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq age rclone
          mkdir -p apps/web/dist   # wrangler.toml's [assets] directory; unused by d1 commands

      - name: Export D1 (remote, production)
        working-directory: apps/api
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 export DB --remote --env production --output "$RUNNER_TEMP/dump.sql"
          D="$RUNNER_TEMP/dump.sql"
          test -s "$D"
          # Sanity: core tables, an owner, and every trigger/view/index packages/db/sql creates.
          grep -Eq 'CREATE TABLE [`"]?receipt[`"]? ' "$D"
          grep -Eq 'CREATE TABLE [`"]?charge[`"]? ' "$D"
          grep -Eq 'CREATE TABLE [`"]?message_template[`"]? ' "$D"
          grep -Eq 'CREATE TABLE [`"]?parent_link[`"]? ' "$D"
          grep -Eq 'INSERT INTO [`"]?user[`"]? ' "$D"
          NAMES=$(grep -ohE 'CREATE (UNIQUE )?(INDEX|TRIGGER|VIEW) (IF NOT EXISTS )?[A-Za-z0-9_]+' ../../packages/db/sql/*.sql | awk '{print $NF}' | sort -u)
          test "$(echo "$NAMES" | wc -l)" -ge 50
          MISSING=0
          for n in $NAMES; do
            grep -Eq "CREATE (UNIQUE )?(INDEX|TRIGGER|VIEW) (IF NOT EXISTS )?[\`\"]?$n[\`\"]?( |\$)" "$D" || { echo "::error::missing from dump: $n"; MISSING=1; }
          done
          test "$MISSING" = 0

      - name: Compress + encrypt + checksum
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          DAY=$(TZ=Asia/Karachi date +%F)
          F="$DAY.sql.gz.age"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "F=$F" >> "$GITHUB_ENV"
          gzip -9 -c "$RUNNER_TEMP/dump.sql" > "$RUNNER_TEMP/dump.sql.gz"
          gzip -t "$RUNNER_TEMP/dump.sql.gz"
          test -n "$AGE_RECIPIENT" || { echo "::error::AGE_RECIPIENT secret missing"; exit 1; }
          age -r "$AGE_RECIPIENT" -o "$F" "$RUNNER_TEMP/dump.sql.gz"
          head -c 30 "$F" | grep -q 'age-encryption.org'   # never decrypted here: no private key in CI
          sha256sum "$F" > "$F.sha256"
          echo "SHA=$(cut -d' ' -f1 "$F.sha256")" >> "$GITHUB_ENV"
          echo "BYTES=$(stat -c%s "$F")" >> "$GITHUB_ENV"

      # Never withholds the upload: the size verdict comes after it and only changes the reported
      # status. Only a genuine "key does not exist" means "no previous size" (the first run); any other
      # error reading LAST_SIZE is reported, and LAST_SIZE is then left alone.
      - name: Previous size (daily/LAST_SIZE)
        run: |
          set -uo pipefail
          if OUT=$(wrangler r2 object get "$R2_BUCKET/daily/LAST_SIZE" --remote --file last_size 2>&1); then
            PREV=$(tr -dc '0-9' < last_size); echo "PREV=${PREV:-0}" >> "$GITHUB_ENV"; echo "PREV_STATE=ok" >> "$GITHUB_ENV"
          elif echo "$OUT" | grep -qiE 'specified key does not exist|NoSuchKey|object not found|\(code: ?10007\)'; then
            echo "no previous size: first run"; echo "PREV=0" >> "$GITHUB_ENV"; echo "PREV_STATE=none" >> "$GITHUB_ENV"
          else
            echo "$OUT"; echo "::warning::could not read daily/LAST_SIZE"
            echo "PREV=0" >> "$GITHUB_ENV"; echo "PREV_STATE=error" >> "$GITHUB_ENV"
          fi

      - name: Upload to R2 (daily/, monthly/ on the 1st)
        run: |
          set -euo pipefail
          wrangler r2 object put "$R2_BUCKET/daily/$F" --file "$F" --remote
          wrangler r2 object put "$R2_BUCKET/daily/$F.sha256" --file "$F.sha256" --remote
          # Pointer the restore drill reads (wrangler has no object listing).
          echo "daily/$F" > latest
          wrangler r2 object put "$R2_BUCKET/daily/LATEST" --file latest --remote
          if [ "$KDAY" = "01" ]; then
            wrangler r2 object put "$R2_BUCKET/monthly/$F" --file "$F" --remote
            wrangler r2 object put "$R2_BUCKET/monthly/$F.sha256" --file "$F.sha256" --remote
          fi
          echo "UPLOADED=true" >> "$GITHUB_ENV"

      - name: Size verdict (after the upload)
        env:
          ALLOW_SHRINK: ${{ vars.BACKUP_ALLOW_SHRINK }}
        run: |
          set -euo pipefail
          NOW=$BYTES
          echo "prev=$PREV ($PREV_STATE) now=$NOW"
          if [ "$PREV_STATE" = error ]; then CHECK=unknown
          elif [ "$NOW" -lt 1000 ]; then CHECK=too_small
          elif [ "$PREV" -gt 0 ] && [ "$NOW" -lt $((PREV/2)) ] && [ "${ALLOW_SHRINK:-}" != "true" ]; then CHECK=shrank
          else CHECK=ok; fi
          echo "SIZE_CHECK=$CHECK" >> "$GITHUB_ENV"
          # LAST_SIZE follows every good upload; a flagged shrink keeps the old size, so the run stays
          # red each night until someone looks (and sets BACKUP_ALLOW_SHRINK=true if it was deliberate).
          if [ "$CHECK" = ok ]; then
            echo "$NOW" > last_size
            wrangler r2 object put "$R2_BUCKET/daily/LAST_SIZE" --file last_size --remote
          else
            echo "::error::size check: $CHECK (previous $PREV bytes, now $NOW bytes); the dump WAS uploaded"
          fi

      - name: Upload to Backblaze B2 (second provider)
        id: b2
        if: ${{ env.HAVE_B2 == 'true' }}
        continue-on-error: true
        env:
          RCLONE_CONFIG_B2_TYPE: s3
          RCLONE_CONFIG_B2_PROVIDER: Other
          RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          RCLONE_CONFIG_B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          B2="B2:$B2_BUCKET"
          rclone copyto "$F" "$B2/daily/$F" --s3-no-check-bucket
          rclone copyto "$F.sha256" "$B2/daily/$F.sha256" --s3-no-check-bucket
          if [ "$KDAY" = "01" ]; then rclone copyto "$F" "$B2/monthly/$F" --s3-no-check-bucket; fi
          rclone check "$F" "$B2/daily/" --include "$F" --one-way
          # Prune: names sort by date. 90 daily, 24 monthly.
          rclone lsf "$B2/daily/" --include '*.age' | sort | head -n -90 | while read -r f; do
            rclone deletefile "$B2/daily/$f" && rclone deletefile "$B2/daily/$f.sha256" || true
          done
          rclone lsf "$B2/monthly/" --include '*.age' | sort | head -n -24 | while read -r f; do
            rclone deletefile "$B2/monthly/$f" || true
          done

      - name: Google Sheet copy (read-only tabs)
        id: sheet
        if: ${{ env.HAVE_SHEET == 'true' }}
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node --experimental-strip-types packages/db/scripts/sheet-export.ts --dump "$RUNNER_TEMP/dump.sql"

      - name: Remove the plain-text dump
        if: always()
        run: shred -u "$RUNNER_TEMP/dump.sql" "$RUNNER_TEMP/dump.sql.gz" 2>/dev/null || true

      - name: Report the run to Maktab (Settings → Backup)
        if: always()
        env:
          TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          B2_OUTCOME: ${{ steps.b2.outcome }}
          SHEET_OUTCOME: ${{ steps.sheet.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "::warning::BACKUP_REPORT_TOKEN not set; run not reported"; exit 0; fi
          target() { # name, outcome ('' = not configured)
            case "$2" in
              success) jq -nc --arg n "$1" '{name:$n, ok:true}' ;;
              '' | skipped) jq -nc --arg n "$1" '{name:$n, ok:false, detail:"not configured"}' ;;
              *) jq -nc --arg n "$1" --arg d "$2" '{name:$n, ok:false, detail:$d}' ;;
            esac
          }
          if [ "$JOB_STATUS" != "success" ]; then STATUS=failed
          elif [ "${SIZE_CHECK:-ok}" != "ok" ]; then STATUS=failed   # uploaded, but shrank/too small
          elif [ "$B2_OUTCOME" != "success" ]; then STATUS=partial   # one provider only
          elif [ "$HAVE_SHEET" = "true" ] && [ "$SHEET_OUTCOME" != "success" ]; then STATUS=partial
          else STATUS=ok; fi
          R2=$(jq -nc --argjson ok "$([ "${UPLOADED:-}" = true ] && echo true || echo false)" \
            --arg check "${SIZE_CHECK:-ok}" '{name:"r2", ok:$ok} + (if $check != "ok" then {detail:$check} else {} end)')
          # backup_enabled: tells the app's backup_stale alarm that the schedule is meant to run.
          DETAILS=$(jq -nc --arg check "${SIZE_CHECK:-}" --arg prev "${PREV:-0}" --arg ps "${PREV_STATE:-}" \
            '{backup_enabled:true, prev_bytes:($prev|tonumber), prev_state:$ps}
             + (if $check != "" then {size_check:$check} else {} end)')
          NOTE=""
          if [ -n "${SIZE_CHECK:-}" ] && [ "$SIZE_CHECK" != ok ]; then NOTE="$SIZE_CHECK: previous ${PREV:-0} bytes, now ${BYTES:-0} bytes (uploaded)"; fi
          BODY=$(jq -nc --arg status "$STATUS" --arg started "$STARTED" --arg key "daily/${F:-}" \
            --arg sha "${SHA:-}" --arg bytes "${BYTES:-0}" --arg url "$RUN_URL" \
            --argjson r2 "$R2" --argjson b2 "$(target b2 "$B2_OUTCOME")" \
            --argjson sheet "$(target sheet "$SHEET_OUTCOME")" \
            --argjson details "$DETAILS" --arg note "$NOTE" \
            '{kind:"nightly", status:$status, started_at:$started, run_url:$url,
              targets:[$r2,$b2,$sheet], details:$details}
             + (if $note != "" then {note:$note} else {} end)
             + (if $sha != "" then {object_key:$key, sha256:$sha, bytes:($bytes|tonumber)} else {} end)')
          echo "$BODY"
          curl -fsS -X POST "$APP_URL/api/backup/runs" -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' --data "$BODY" || echo "::warning::report failed"

      # After the report: a flagged size makes the run red (so the issue below opens), the upload stays.
      - name: Fail the run when the size check did not pass
        if: ${{ env.SIZE_CHECK != '' && env.SIZE_CHECK != 'ok' }}
        run: |
          echo "::error::size check $SIZE_CHECK; see the step 'Size verdict'. Deliberate? Set the variable BACKUP_ALLOW_SHRINK=true for one run."
          exit 1

      # One open issue at a time: a later failure comments on it; the next good run closes it.
      - name: Notify on failure (one issue, watchers get an e-mail)
        if: failure()
        uses: actions/github-script@v7
        env:
          SIZE_CHECK: ${{ env.SIZE_CHECK }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const day = new Date().toISOString().slice(0, 10);
            const why = process.env.SIZE_CHECK && process.env.SIZE_CHECK !== 'ok'
              ? ` (size check: ${process.env.SIZE_CHECK}; the dump was uploaded)` : '';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open',
              labels: 'backup-failed', per_page: 1 });
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number,
                body: `Failed again ${day}${why}. Run: ${url}` });
            } else {
              await github.rest.issues.create({ ...context.repo,
                title: `Nightly backup FAILED ${day}`,
                body: `Run: ${url}${why}\nCheck docs/restore.md before assuming the last good backup is recent.\nThis issue closes itself after the next successful run.`,
                labels: ['backup-failed'] });
            }

      - name: Close the failure issue after a good run
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo,
              state: 'open', labels: 'backup-failed', per_page: 100 });
            for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
                body: `Recovered: the nightly backup succeeded. Run: ${url}` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed',
                state_reason: 'completed' });
            }

      # Keep-alive (GitHub's 60-day rule for scheduled workflows): on the 1st (Karachi) commit a short
      # status file to main as github-actions[bot]. No checkout needed: the contents API makes the commit.
      - name: Monthly status commit (docs/backup-status.md)
        if: ${{ always() && env.KDAY == '01' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const e = process.env;
            const path = 'docs/backup-status.md';
            const status = e.JOB_STATUS === 'success' ? (e.SIZE_CHECK && e.SIZE_CHECK !== 'ok' ? 'failed' : 'ok') : 'failed';
            const targets = ['r2: ' + (e.UPLOADED === 'true' ? 'ok' : 'not uploaded'),
              'b2: ' + (e.HAVE_B2 === 'true' ? 'configured' : 'not configured'),
              'sheet: ' + (e.HAVE_SHEET === 'true' ? 'configured' : 'not configured')];
            const text = [
              '# Nightly backup status',
              '',
              'Written by the nightly-backup workflow on the 1st of each month (Asia/Karachi) so the',
              'repository shows activity and GitHub keeps the schedule enabled (docs/backup.md, "60-day rule").',
              'Live status: Settings → Backup in the app.',
              '',
              '| | |', '|---|---|',
              `| Last run | ${e.DAY || new Date().toISOString().slice(0, 10)} (${status}) |`,
              `| File | ${e.F ? 'daily/' + e.F : '—'} |`,
              `| Size | ${e.BYTES ? e.BYTES + ' bytes' : '—'} |`,
              `| sha256 | ${e.SHA ? e.SHA.slice(0, 12) + '…' : '—'} |`,
              `| Targets | ${targets.join(', ')} |`,
              '',
            ].join('\n');
            let sha;
            try {
              const cur = await github.rest.repos.getContent({ ...context.repo, path, ref: 'main' });
              sha = cur.data.sha;
            } catch (err) { if (err.status !== 404) throw err; }
            await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path, branch: 'main', sha,
              message: `backup: monthly status ${e.DAY || ''} [skip ci]`,
              content: Buffer.from(text).toString('base64'),
              committer: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' },
              author: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' } });
