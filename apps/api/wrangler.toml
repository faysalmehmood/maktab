# Maktab Worker: serves the built web app (static assets) and the /api/* routes.
# Local dev needs no Cloudflare account:  npm run db:migrate:local && npm run dev
# Secrets for local dev go in apps/api/.dev.vars (see .dev.vars.example); in production use
#   npx wrangler secret put SESSION_SECRET --env production   (and PARENT_LINK_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)

name = "maktab"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Smaller bundle = faster cold starts on the free plan.
minify = true

# The SPA's security headers (CSP, frame-ancestors, nosniff, referrer policy) come from
# apps/web/public/_headers, which Vite copies to dist/ and Workers Static Assets applies to every
# asset response (the file itself is never served). /api/* responses get theirs from secureHeaders().
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, SPA fallback would answer /api/* with index.html. /__scheduled is wrangler dev's
# --test-scheduled trigger (smoke:m3); without --test-scheduled (and in production) the Worker
# answers it with its JSON 404.
# /p is the parent page (/p#<token>): the Worker serves index.html itself with noindex / no-store
# and the SPA headers; /p/* gets the same shell (a token never belongs in a path).
run_worker_first = ["/api/*", "/__scheduled", "/p", "/p/*"]

[[d1_databases]]
binding = "DB"
database_name = "maktab"
# Any id works for --local; the real id comes from `wrangler d1 create maktab` (production below).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

# Declared for student photos / payment proofs; milestone 0 never touches it.
[[r2_buckets]]
binding = "FILES"
bucket_name = "maktab-files"

# Nightly encrypted dumps written by GitHub Actions (.github/workflows/nightly-backup.yml); the
# Worker only lists them for Settings → Backup (M6). Locally an empty simulated bucket.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "maktab-backups"

[vars]
APP_ORIGIN = "http://localhost:5173"
# The only Google account that may claim an empty installation as owner (case-insensitive).
# Empty = nobody can bootstrap. Override locally in .dev.vars.
OWNER_EMAIL = ""

[observability]
enabled = true

# Monthly fee generation + late fines (apps/api/src/index.ts scheduled): every 30 minutes, a few
# resumable chunks per run; idle runs cost one read. One of the five free cron triggers.
[triggers]
crons = ["*/30 * * * *"]

# ---------------------------------------------------------------------------------------------
# Production (pilot): maktab.conceptlix.com. Bindings and vars are NOT inherited from the top
# level, so each is repeated here. Before the first `npx wrangler deploy --env production`:
#   1. npx wrangler d1 create maktab            -> paste database_id below
#   2. npx wrangler r2 bucket create maktab-files ; npx wrangler r2 bucket create maktab-backups
#   3. npx wrangler secret put SESSION_SECRET --env production   (>= 32 random chars)
#      npx wrangler secret put PARENT_LINK_SECRET --env production   (>= 32 random chars, its own)
#      npx wrangler secret put GOOGLE_CLIENT_ID --env production
#      npx wrangler secret put GOOGLE_CLIENT_SECRET --env production
#      openssl rand -hex 32 | npx wrangler secret put BACKUP_REPORT_TOKEN --env production
#        (the same value as the GitHub secret BACKUP_REPORT_TOKEN; docs/backup.md)
#   4. Google Cloud console: authorised redirect URI
#      https://maktab.conceptlix.com/api/auth/google/callback ; publish the consent screen.
#   5. npx wrangler d1 migrations apply DB --remote --env production
# ---------------------------------------------------------------------------------------------
[env.production]
name = "maktab"
routes = [{ pattern = "maktab.conceptlix.com", custom_domain = true }]

[env.production.triggers]
crons = ["*/30 * * * *"]

[env.production.vars]
APP_ORIGIN = "https://maktab.conceptlix.com"
# Set before the first sign-in; after the owner exists it no longer matters.
OWNER_EMAIL = "thefaysalmehmood@gmail.com"
# Cloudflare Turnstile (M7, optional): paste the widget's public site key here and set the secret
# with `npx wrangler secret put TURNSTILE_SECRET --env production` (docs/deploy.md §8). Either one
# missing = Turnstile off.
# TURNSTILE_SITE_KEY = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "maktab"
database_id = "440d652e-46bc-4389-88cc-b9a9fccffc44"
migrations_dir = "../../packages/db/migrations"

# Student photos and the logo (bucket created after R2 was enabled, see docs/deploy-log.md).
[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "maktab-files"

[[env.production.r2_buckets]]
binding = "BACKUPS"
bucket_name = "maktab-backups"

# ---------------------------------------------------------------------------------------------
# GSA pilot (2026-10-13): maktab-gsap.conceptlix.com, its own Worker, D1 and files bucket. The real
# school's installation: backed up nightly (.github/workflows/nightly-backup.yml, --env gsap), never
# DEMO_MODE. Secrets (each its own value, piped from openssl, never echoed):
#   SESSION_SECRET, PARENT_LINK_SECRET, BACKUP_REPORT_TOKEN (= the GitHub secret), GOOGLE_CLIENT_ID,
#   GOOGLE_CLIENT_SECRET. Google Cloud console: add the authorised redirect URI
#   https://maktab-gsap.conceptlix.com/api/auth/google/callback (docs/deploy.md).
# Later (M8): GSA's own Cloudflare account behind a front-door Worker.
# ---------------------------------------------------------------------------------------------
[env.gsap]
name = "maktab-gsap"
routes = [{ pattern = "maktab-gsap.conceptlix.com", custom_domain = true }]

[env.gsap.triggers]
crons = ["*/30 * * * *"]

[env.gsap.vars]
APP_ORIGIN = "https://maktab-gsap.conceptlix.com"
# GSA's owner (Shahid Iqbal): his first Google sign-in claims the empty installation and runs the wizard.
OWNER_EMAIL = "shahid.ics.pu@gmail.com"

[[env.gsap.d1_databases]]
binding = "DB"
database_name = "maktab-gsap"
database_id = "3e0f42ab-c488-475b-8aea-28e85b5e4549"
migrations_dir = "../../packages/db/migrations"

[[env.gsap.r2_buckets]]
binding = "FILES"
bucket_name = "maktab-gsap-files"

[[env.gsap.r2_buckets]]
binding = "BACKUPS"
bucket_name = "maktab-backups"
