<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Maktab — attendance, fees and messages for community schools. مکتب" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Maktab</title>
    <!--
      No flash of the wrong theme (M7b): the page background follows the phone's setting before any
      CSS or script loads (inline styles are allowed by the CSP), and theme-boot.js applies the
      saved choice (maktab.theme) and school colour before the bundle runs.
    -->
    <style>
      html { background: #f3f6f5; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) { background: #0c1413; color-scheme: dark; }
      }
      html.dark { background: #0c1413; color-scheme: dark; }
    </style>
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
